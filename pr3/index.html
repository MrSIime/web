<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table style="height: 200px; width: 200px; text-align: center; color: black; background-color: rgb(238, 188, 96);">
        <tr style="border-top: 2px dotted red;">
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td rowspan="2" style="background-color: rgb(18, 200, 255);">6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td style="background-color: rgb(233, 52, 52);">14</td>
            <td>15</td>
            <td>16</td>
        </tr>
        <tr>
            <td>17</td>
            <td style="background-color: rgb(233, 52, 52);">18</td>
            <td>19</td>
            <td>20</td>
        </tr>
        <tr>
            <td>21</td>
            <td style="background-color: rgb(233, 52, 52);">22</td>
            <td>23</td>
            <td>24</td>
        </tr>
        <tr>
            <td>25</td>
            <td colspan="3" style="background-color: greenyellow;">26</td>
        </tr>
        <tr style="border-bottom: 2px dotted red;">
            <td>27</td>
            <td style="background-color: rgb(18, 200, 255);">28</td>
            <td style="background-color: rgb(18, 200, 255);">29</td>
            <td style="background-color: rgb(18, 200, 255);">20</td>
        </tr>
    </table>
</body>
</html>
